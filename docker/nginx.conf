# Cliente PokerSoul: arquivos estáticos, com cache longo no que tem hash no nome.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # o app é uma página só: qualquer rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # arquivos com hash no nome podem ficar no cache para sempre
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # o index e a configuração nunca ficam no cache (senão o endereço do servidor "cola")
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location = /config.js {
    add_header Cache-Control "no-store";
  }
}
