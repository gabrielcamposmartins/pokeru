# pokeru.padoru.org no nginx de borda da VM (/srv/edge/nginx/conf.d/pokeru.conf).
#
# Um domínio, dois serviços atrás dele, os dois na rede "edge":
#   - pokeru-server (o jogo): o WebSocket das mesas, /auth (login, cadastro, Discord), /health e /admin;
#   - pokeru-client (a interface): a página do jogo no navegador e os arquivos dela.
#
# O app desktop e o web conectam o WebSocket na raiz (wss://pokeru.padoru.org): o que decide o
# destino da raiz é o cabeçalho Upgrade — com ele, é o jogo; sem ele, é um navegador pedindo a página.
# O TLS termina aqui (Let's Encrypt); por dentro, tudo é HTTP na rede do Docker.

# a raiz: com Upgrade vai para o jogo, sem ele para a página
map $http_upgrade $pokeru_raiz {
    default http://pokeru-client:80;
    ~.+     http://pokeru-server:3001;
}

server {
    listen 80;
    server_name pokeru.padoru.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name pokeru.padoru.org;

    ssl_certificate     /etc/letsencrypt/live/pokeru.padoru.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokeru.padoru.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # DNS interno do Docker, resolvido a cada requisição: o nginx não quebra
    # se um dos contêineres for recriado e mudar de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pokeru http://pokeru-server:3001;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # o servidor do jogo: contas, estado e administração
    location ~ ^/(auth|health|admin)(/|$) {
        proxy_pass $pokeru;
    }

    # a raiz e todo o resto: o WebSocket (com Upgrade) vai para o jogo; o navegador, para a página
    location / {
        proxy_pass $pokeru_raiz;
        # um proxy_set_header aqui desliga a herança dos de cima: todos vão repetidos
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # mesas paradas não podem cair pelo timeout padrão de 60 s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
