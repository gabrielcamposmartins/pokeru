[package]
name = "pokersoul"
version = "0.1.0"
description = "PokerSoul — poker 2D multiplayer"
authors = ["PokerSoul"]
edition = "2021"

[lib]
name = "pokersoul_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
