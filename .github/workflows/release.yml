# Publica uma versão do cliente desktop.
#
# Só a main publica, e só por tag: ao criar `vX.Y.Z` na main, esta action compila o app, cria a
# release e sobe o instalador — mais o `.sig` e o `latest.json` quando há chave de assinatura, que
# é o que o atualizador automático do jogo consulta.
#
# A develop é de propósito sem action: lá o trabalho corre sem CI, e nada é publicado.
#
# A assinatura do atualizador é **opcional** aqui, e a action não barra por causa dela. Com os
# segredos configurados (Settings → Secrets and variables → Actions), a partir da chave gerada por
# `tauri signer generate`:
#
#   TAURI_SIGNING_PRIVATE_KEY           conteúdo de ~/.tauri/pokeru-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  a senha da chave (vazio se ela não tiver)
#
# …a release sai com `.sig` e `latest.json`, e o app se atualiza sozinho. **Sem eles**, a action
# publica o instalador do mesmo jeito, só sem os artefatos do atualizador — e avisa no resumo. O
# que isso custa: quem já tem o jogo instalado não recebe esta versão sozinho, porque o atualizador
# recusa pacote sem assinatura válida (e, sem `latest.json` na release mais nova, nem chega a
# procurar). Dá para publicar assim e assinar depois, ou assinar na mão como em v0.3.0/v0.4.0.

name: Release

on:
  push:
    tags: ['v*.*.*']
  # permite repetir uma publicação pela interface do GitHub (escolha a tag em "Run workflow")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sem chave, o Tauri se recusa a gerar os artefatos do atualizador (a `tauri.conf.json` pede
      # `createUpdaterArtifacts: true`). Então a gente os desliga por configuração, em vez de deixar
      # a compilação falhar no meio.
      - name: Tem chave de assinatura?
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'args=' >> "$GITHUB_OUTPUT"
            echo '✓ assinatura ligada: a release sai com .sig e latest.json' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'args=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_OUTPUT"
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY: a release sai sem assinatura e sem latest.json, então quem já tem o jogo não se atualiza sozinho."
            {
              echo '⚠ **Sem `TAURI_SIGNING_PRIVATE_KEY`.** O instalador foi publicado, mas sem'
              echo '`.sig` nem `latest.json` — a atualização automática não enxerga esta versão.'
              echo 'Configure os dois segredos do repositório para ligá-la.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: A tag está na main?
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Esta tag não aponta para um commit da main — publique a partir da main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: As versões batem com a tag?
        shell: bash
        run: node scripts/version.mjs --check "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      # nada de publicar uma versão quebrada
      - run: npm run typecheck
      - run: npm test

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Compila e publica
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ steps.sign.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: Pokeru __VERSION__
          releaseBody: |
            Instalador do cliente desktop (Windows x64).

            ${{ steps.sign.outputs.signed == 'true' && 'O app **se atualiza sozinho**: quem já está na 0.2.0 ou mais recente recebe esta versão ao abrir o jogo. Os arquivos `latest.json` e `.sig` são o que o atualizador consulta.' || '**Esta versão saiu sem assinatura**, então a atualização automática não a enxerga: quem já tem o jogo instalado precisa baixar o instalador aqui.' }}

            Instalação manual: baixe e execute `Pokeru___VERSION___x64-setup.exe` (instala para o
            usuário atual, sem administrador). O instalador não é assinado com certificado de
            código, então o SmartScreen avisa — *Mais informações* → *Executar assim mesmo*.
          releaseDraft: false
          prerelease: false
          # o latest.json só faz sentido assinado: sem chave, não há manifesto para publicar
          includeUpdaterJson: ${{ steps.sign.outputs.signed == 'true' }}

  # Para publicar também macOS e Linux, troque o job acima por uma matriz:
  #
  #   strategy:
  #     matrix:
  #       include:
  #         - { runner: windows-latest, args: '' }
  #         - { runner: macos-latest,   args: '--target universal-apple-darwin' }
  #         - { runner: ubuntu-22.04,   args: '' }
  #
  # No Ubuntu, instale antes as dependências do WebKit:
  #   sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
  #
  # A tauri-action junta as plataformas no mesmo latest.json quando os jobs usam a mesma tag.
