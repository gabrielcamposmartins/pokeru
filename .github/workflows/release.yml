# Publica uma versão do cliente desktop.
#
# Só a main publica, e só por tag: ao criar `vX.Y.Z` na main, esta action compila o app, cria a
# release e sobe o instalador — mais o `.sig` e o `latest.json` quando há chave de assinatura, que
# é o que o atualizador automático do jogo consulta.
#
# A develop é de propósito sem action: lá o trabalho corre sem CI, e nada é publicado.
#
# A assinatura do atualizador é **opcional** aqui, e a action não barra por causa dela. Com os
# segredos configurados (Settings → Secrets and variables → Actions), a partir da chave gerada por
# `tauri signer generate`:
#
#   TAURI_SIGNING_PRIVATE_KEY           conteúdo de ~/.tauri/pokeru-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  a senha da chave (vazio se ela não tiver)
#
# …a release sai com `.sig` e `latest.json`, e o app se atualiza sozinho.
#
# **Sem eles** a action compila de todo jeito, mas **não publica**: o instalador fica como artefato
# do job (aba Summary → Artifacts), para baixar e anexar à release na mão. Ela não publica porque
# um pacote sem assinatura substituiria, numa release já feita à mão, o instalador assinado — e aí
# o `.sig` deixaria de bater com o arquivo e o atualizador recusaria a versão. Melhor entregar o
# binário e deixar a decisão com quem tem a chave.

name: Release

on:
  push:
    tags: ['v*.*.*']
  # permite repetir uma publicação pela interface do GitHub (escolha a tag em "Run workflow")
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instalador (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tem chave de assinatura?
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo '✓ assinatura ligada: a release sai com o instalador, o .sig e o latest.json.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Sem TAURI_SIGNING_PRIVATE_KEY: o instalador fica como artefato do job e nada é publicado."
            {
              echo '⚠ **Sem `TAURI_SIGNING_PRIVATE_KEY`.** Compilei, mas **não publiquei**: o'
              echo 'instalador está em *Artifacts*, aqui no resumo, para você anexar à release.'
              echo ''
              echo 'Publicar um pacote sem assinatura substituiria o assinado numa release feita à'
              echo 'mão, e aí o `.sig` não bateria mais com o arquivo — o atualizador recusaria a'
              echo 'versão. Configure os dois segredos do repositório para a action publicar sozinha.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: A tag está na main?
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Esta tag não aponta para um commit da main — publique a partir da main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: As versões batem com a tag?
        shell: bash
        run: node scripts/version.mjs --check "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      # nada de publicar uma versão quebrada
      - run: npm run typecheck
      - run: npm test

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Compila, assina e publica
        if: steps.sign.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: Pokeru __VERSION__
          releaseBody: |
            Instalador do cliente desktop (Windows x64). O app **se atualiza sozinho**: quem já está
            na 0.2.0 ou mais recente recebe esta versão ao abrir o jogo.

            Instalação manual: baixe e execute `Pokeru___VERSION___x64-setup.exe` (instala para o
            usuário atual, sem administrador). O instalador não é assinado com certificado de
            código, então o SmartScreen avisa — *Mais informações* → *Executar assim mesmo*.

            Os arquivos `latest.json` e `.sig` são o que o atualizador consulta.
          releaseDraft: false
          prerelease: false
          # gera e sobe o latest.json (o manifesto lido pelo atualizador)
          includeUpdaterJson: true

      # Sem chave: compila e entrega o binário, sem tocar em release nenhuma. O
      # `createUpdaterArtifacts` da tauri.conf é desligado aqui, senão o Tauri para por falta da
      # chave privada no meio da compilação.
      - name: Compila sem assinar
        if: steps.sign.outputs.signed != 'true'
        run: npm run app:build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Guarda o instalador como artefato
        if: steps.sign.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pokeru-instalador-sem-assinatura
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Para publicar também macOS e Linux, troque o job acima por uma matriz:
  #
  #   strategy:
  #     matrix:
  #       include:
  #         - { runner: windows-latest, args: '' }
  #         - { runner: macos-latest,   args: '--target universal-apple-darwin' }
  #         - { runner: ubuntu-22.04,   args: '' }
  #
  # No Ubuntu, instale antes as dependências do WebKit:
  #   sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
  #
  # A tauri-action junta as plataformas no mesmo latest.json quando os jobs usam a mesma tag.
